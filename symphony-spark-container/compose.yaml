name: airi-symphony

services:
  qwen-init:
    image: vllm/vllm-openai@sha256:a17c15e30254f83adadcf1d9b85db18c59ea1e76a1aca1db8db20c3a12b48ba2
    platform: linux/arm64
    entrypoint: [hf]
    command:
      - download
      - Qwen/Qwen3.8-27B
      - --max-workers
      - '1'
    labels:
      owner: sephy
      ai.model: qwen3.8-27b
    environment:
      HF_HOME: /cache/huggingface
      HF_HUB_DISABLE_TELEMETRY: '1'
    volumes:
      - qwen-huggingface-cache:/cache/huggingface
    networks:
      - download
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    mem_limit: 4g
    memswap_limit: 4g
    cpus: 4
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: 'no'
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '2'

  qwen:
    image: vllm/vllm-openai@sha256:a17c15e30254f83adadcf1d9b85db18c59ea1e76a1aca1db8db20c3a12b48ba2
    platform: linux/arm64
    depends_on:
      qwen-init:
        condition: service_completed_successfully
    labels:
      owner: sephy
      ai.model: qwen3.8-27b
    command:
      - Qwen/Qwen3.8-27B
      - --served-model-name
      - qwen3.8-27b
      - --host
      - 0.0.0.0
      - --port
      - '8000'
      - --tensor-parallel-size
      - '1'
      - --max-model-len
      - '65536'
      - --max-num-seqs
      - '1'
      - --max-num-batched-tokens
      - '4096'
      - --gpu-memory-utilization
      - '0.80'
      - --reasoning-parser
      - qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
    environment:
      HF_HOME: /cache/huggingface
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      XDG_CACHE_HOME: /cache/vllm/xdg-cache
      XDG_CONFIG_HOME: /cache/vllm/xdg-config
      TORCHINDUCTOR_CACHE_DIR: /cache/vllm/torchinductor
      TRITON_CACHE_DIR: /cache/vllm/triton
      VLLM_CACHE_ROOT: /cache/vllm
      FLASHINFER_WORKSPACE_BASE: /cache/vllm
    volumes:
      - qwen-huggingface-cache:/cache/huggingface
      - qwen-vllm-cache:/cache/vllm
    networks:
      - model
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 180s
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=1g,mode=1777
    shm_size: 8g
    mem_limit: 64g
    memswap_limit: 64g
    cpus: 12
    pids_limit: 512
    gpus: all
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: '3'

  ssh-agent:
    image: airi-symphony:v0.0.3
    labels:
      owner: sephy
    entrypoint: ['/usr/bin/tini', '--', '/usr/local/lib/symphony/ssh-agent-entrypoint.sh']
    environment:
      DEPLOY_KEY_PATH: /run/secrets/github-deploy-key
      SSH_AUTH_SOCK: /ssh-agent/agent.sock
    volumes:
      - ./secrets/github-deploy-key:/run/secrets/github-deploy-key:ro
      - ./state/ssh-agent:/ssh-agent
    healthcheck:
      test: ['CMD-SHELL', 'SSH_AUTH_SOCK=/ssh-agent/agent.sock ssh-add -l >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  issue-labeler:
    image: airi-symphony:v0.0.3
    labels:
      owner: sephy
    entrypoint: ['/usr/bin/tini', '--', '/usr/local/lib/symphony/issue-labeler.sh']
    env_file:
      - .env
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  orchestrator:
    image: airi-symphony:v0.0.3
    labels:
      owner: sephy
    build:
      context: .
      args:
        APP_GID: '1003'
        APP_UID: '1003'
        CODEX_VERSION: '0.155.1'
        SYMPHONY_VERSION: 'v0.0.3'
    depends_on:
      ssh-agent:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SSH_AUTH_SOCK: /ssh-agent/agent.sock
      SYMPHONY_INSTALL_DIR: /var/lib/symphony/install
    volumes:
      - ../WORKFLOW.md:/opt/symphony/WORKFLOW.md:ro
      - ./state/codex:/var/lib/symphony/codex
      - ./state/runtime:/var/lib/symphony
      - ./state/ssh-agent:/ssh-agent:ro
    networks:
      - default
      - model
    ports:
      - '127.0.0.1:4100:4000'
    healthcheck:
      test: ['CMD-SHELL', 'curl --fail --silent --show-error http://127.0.0.1:4000/api/v1/state >/dev/null']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    # The observed full-repository lint peak is about 583 MiB. Keep sixfold
    # headroom for uncached installs, tests, and the Codex worker process.
    mem_limit: 4g
    memswap_limit: 8g
    cpus: 12
    pids_limit: 4096
    read_only: true
    tmpfs:
      # Burrito starts BEAM through a hashed musl interpreter that it extracts here.
      - /tmp:rw,exec,nosuid,nodev,size=2g,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  qwen-huggingface-cache:
  qwen-vllm-cache:

networks:
  model:
    name: airi-symphony-model
    internal: true
  download:
    name: airi-symphony-download
